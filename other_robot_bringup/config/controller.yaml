diff_drive_controller:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController 

    left_wheel_names:
      - base_left_wheel_joint

    right_wheel_names:
      - base_right_wheel_joint

    wheel_radius: 0.1
    wheel_separation: 0.45

    base_frame_id: base_footprint
    odom_frame_id: odom 

    publish_rate: 50.0

    publish_odom_tf: true
#    enable_odom_tf: true

